[project]
name = "visualizer-agent-backend"
version = "0.1.0"
description = "PydanticAI-powered visual companion agent backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.142.2,<1.0.0",
  "google-genai>=1.70.0,<2.0.0",
  "httpx>=0.28.1,<1.0.0",
  "orjson>=3.11.4,<4.0.0",
  "pydantic-ai-slim[google]>=1.23.0,<2.0.0",
  "pydantic-settings>=2.11.0,<3.0.0",
  "pyyaml>=6.0.3,<7.0.0",
  "sse-starlette>=3.0.2,<4.0.0",
  "uvicorn[standard]>=0.37.0,<1.0.0",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.12,<2.0.0",
]
render = [
  "playwright>=1.49",
]
dev = [
  "mypy>=1.19.0,<2.0.0",
  "pytest>=8.4,<10.0.0",
  "pytest-asyncio>=1.3.0,<2.0.0",
  "ruff>=0.15.0,<1.0.0",
  "types-PyYAML>=6.0.12.20250915,<7.0.0",
]

[project.scripts]
visualizer-mcp = "app.mcp.__main__:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"app.mcp.render" = ["assets/*.css", "assets/*.json"]
