services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      DATABASE_PATH: /app/data/conversations.db
    volumes:
      - conversations-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_VITE_API_BASE_URL:-}
        VITE_CHAT_API_KEY: ${PUBLIC_VITE_CHAT_API_KEY:-${VITE_CHAT_API_KEY:-}}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  conversations-data:
